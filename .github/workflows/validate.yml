name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin store
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install jsonschema

      - name: Validate all plugins
        run: python scripts/validate.py

      - name: Audit plugin source (downloads / elevation / shell-outs)
        run: python scripts/check_safety.py

      - name: Check PR scope
        if: github.event_name == 'pull_request'
        run: python scripts/check_scope.py --base "${{ github.event.pull_request.base.sha }}"
