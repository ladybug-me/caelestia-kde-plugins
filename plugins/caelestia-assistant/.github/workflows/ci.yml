name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the full unittest suite
        run: python3 -m unittest discover -s . -p "test_*.py"
      - name: Selfcheck (rule schema + safety pins AST lint)
        run: python3 -m assistant.hub selfcheck

  shell-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash test harness
        run: bash tests/test_assistant.sh
